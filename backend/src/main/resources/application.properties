spring.application.name=serviq-backend
server.port=8081

# PostgreSQL connection
spring.datasource.url=${SERVIQ_DATABASE_URL:jdbc:postgresql://localhost:5432/serviq_db}
spring.datasource.username=${SERVIQ_DATABASE_USERNAME:portfolio_admin}
spring.datasource.password=${SERVIQ_DATABASE_PASSWORD}

# Database schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Monitoring
management.endpoints.web.exposure.include=health,info
